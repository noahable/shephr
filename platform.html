// ── SHARED PRIMITIVES ──────────────────────────────────────────────────────
const styles = `
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:${C.bg};}
  ::selection{background:${C.gold};color:#000;}
  .fade-in{animation:fadeIn 0.4s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .pill-btn:hover{border-color:${C.goldSoft}!important;color:${C.goldSoft}!important;}
  .card-hover:hover{border-color:${C.borderHi}!important;transform:translateY(-2px);}
  .nav-item:hover{color:${C.goldSoft}!important;}
  .expand-row:hover{background:rgba(212,168,71,0.03)!important;}
`;
 
const Label = ({ children, color = C.gold }) => (
  <span style={{fontFamily:'DM Mono',fontSize:10,letterSpacing:'0.18em',textTransform:'uppercase',
    color, border:`1px solid ${color}40`, background:`${color}0f`,
    padding:'3px 10px', borderRadius:2, display:'inline-block', whiteSpace:'nowrap'}}>
    {children}
  </span>
);

  <div style={{height:1,background:`linear-gradient(90deg,transparent,${C.border},transparent)`,margin:m}} />
);
 
const Stat = ({ value, label, color = C.gold, mono = true }) => (
  <div>
    <div style={{fontSize:32,fontWeight:700,color,fontFamily: mono ? 'DM Mono' : 'Playfair Display',lineHeight:1,marginBottom:4}}>{value}</div>
    <div style={{fontSize:11,color:C.muted,fontFamily:'DM Mono',letterSpacing:'0.1em',textTransform:'uppercase'}}>{label}</div>
  </div>
);

  <div style={{height:h,background:'rgba(255,255,255,0.06)',borderRadius:h,overflow:'hidden'}}>
    <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:h,
      boxShadow:`0 0 8px ${color}60`,transition:'width 0.8s ease'}} />
  </div>
);

  <div style={{marginBottom:40}}>
    <Label>{eyebrow}</Label>
    <h2 style={{fontFamily:'Playfair Display',fontSize:36,fontWeight:600,color:C.white,
      letterSpacing:'-0.01em',lineHeight:1.15,margin:'14px 0 10px'}}>{title}</h2>
    {sub && <p style={{fontSize:15,color:C.muted,lineHeight:1.7,maxWidth:580}}>{sub}</p>}
  </div>
);
 
// ══════════════════════════════════════════════════════════════════════════
//  DOC 1 — PROJECT BRIEF
// ══════════════════════════════════════════════════════════════════════════
 
const WEEKS = [
  { w:'1–2', phase:'Scenario Scoping', color:C.gold,
    tasks:['Joint workshop with sponsor team to select primary disruption scenario','Map existing team decision workflows and pain points','Define baseline metrics: current response time, passenger impact per event','Finalise participant cohort (10–14 operations and customer experience leads'],
    deliverable:'Signed scenario brief & baseline data snapshot' },
  { w:'3–4', phase:'Scenario Build & Calibration', color:C.amber,
    tasks:['Configure war games environment to selected scenario','Inject real historical disruption data as scenario substrate','Facilitator walkthrough and dry run with sponsor contact','Adjust difficulty parameters and decision injection points'],
    deliverable:'Validated scenario environment ready for live sessions' },
  { w:'5–6', phase:'Live War Games Sessions', color:C.goldSoft,
    tasks:['Run 2× structured war games sessions with participant cohort','Facilitator-led debrief after each session using After Action Review','Capture decision quality data, response time, and cascade impact scores','Mid-point check-in with IAGi sponsor lead'],
    deliverable:'Session recordings + raw performance dataset' },
  { w:'7–8', phase:'Analysis & Summit Prep', color:'#a8c4e8',
    tasks:['Statistical analysis of pre/post decision performance delta','Compile After Action Review summary report','Prepare Innovation Summit presentation with sponsor','Draft commercial roadmap for post-accelerator engagement'],
    deliverable:'Summit deck + AAR report + commercial proposal' },
];

  { icon:'⏱', label:'Decision Speed', desc:'Time from disruption trigger to first recovery action', target:'≥20% reduction post-training' },

  { icon:'🧳', label:'Passenger Outcome Score', desc:'Simulated passengers protected from misconnect or stranding', target:'≥15% improvement vs benchmark' },
  { icon:'📊', label:'Team Confidence Index', desc:'Self-reported readiness score (pre/post survey)', target:'Statistically significant uplift' },
];
 
function ProjectBrief() {
  const [openWeek, setOpenWeek] = useState(null);
  return (
    <div className="fade-in">
      {/* Hero */}
      <div style={{background:`linear-gradient(135deg,${C.surface} 0%,#161620 100%)`,
        border:`1px solid ${C.border}`,borderRadius:16,padding:'52px 56px',marginBottom:48,
        position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-60,right:-60,width:280,height:280,borderRadius:'50%',
          background:`radial-gradient(circle,${C.gold}12,transparent 70%)`,pointerEvents:'none'}} />
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:1,
          background:`linear-gradient(90deg,transparent,${C.border},transparent)`}} />
        <Label>IAGi Deploy 2026 · Project Brief</Label>
        <h1 style={{fontFamily:'Playfair Display',fontSize:48,fontWeight:700,color:C.white,
          letterSpacing:'-0.02em',lineHeight:1.08,margin:'20px 0 16px'}}>
          War Games for<br/><span style={{color:C.gold}}>Disruption Resilience</span>
        </h1>
        <p style={{fontSize:16,color:C.muted,lineHeight:1.7,maxWidth:520,marginBottom:36}}>
          A structured 8-week pilot to validate simulation-based training as a measurable lever for decision quality during major disruption events.
        </p>
        <div style={{display:'flex',gap:40,flexWrap:'wrap'}}>
          {[['Category','Tech Evolution & Resilience'],['Scenario','Major Hub Weather Event'],['Duration','8 Weeks'],['Participants','10–14 Leads']].map(([l,v])=>(
            <div key={l}>
              <div style={{fontFamily:'DM Mono',fontSize:10,color:C.dim,letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:4}}>{l}</div>
              <div style={{fontSize:14,fontWeight:600,color:C.goldSoft}}>{v}</div>

                padding:'6px 14px',borderRadius:20,cursor:'pointer',border:`1px solid ${C.border}`,
                background:d.id===active?`${C.gold}12`:'transparent',
                color:d.id===active?C.gold:C.dim,transition:'all 0.15s'}}>
                {d.icon} {d.label}
              </button>
            ))}
          </div>
        </div>
 
        {/* Content */}
        <div style={{padding:'52px'}}>
          {active==='brief'     && <ProjectBrief />}
          {active==='aar'       && <AfterAction />}
          {active==='commercial'&& <Commercial />}
        </div>
 
        {/* Content footer */}
        <div style={{borderTop:`1px solid ${C.border}`,padding:'20px 52px',
          display:'flex',justifyContent:'space-between',
          fontFamily:'DM Mono',fontSize:10,color:C.dim,letterSpacing:'0.1em',textTransform:'uppercase'}}>
          <span>Shepherd · Disruption Intelligence</span>
          <span>Confidential · 2026</span>
        </div>
      </main>
    </div>
  );
}
 
window.__ShepherdRoot = App;
 
    const rootEl = document.getElementById('root');
    const root = ReactDOM.createRoot(rootEl);
    root.render(React.createElement(window.__ShepherdRoot));
  </script>
</body>
